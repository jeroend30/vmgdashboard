<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inlog Pin Point - VMG</title>
  
  <!-- Leaflet CSS voor de Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.82);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --alarm-red: #ef4444;
      --alarm-red-glow: rgba(239, 68, 68, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url('https://images5.alphacoders.com/118/thumb-1920-1188770.jpg') center/cover no-repeat fixed;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
    }

    .logo-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      max-height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-popup {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid var(--accent);
      color: #7dd3fc;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-popup:hover {
      background: rgba(56, 189, 248, 0.38);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid var(--alarm-red);
      color: #fca5a5;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.38);
      color: #fff;
      box-shadow: 0 0 12px var(--alarm-red-glow);
    }

    .main-container {
      display: flex;
      flex: 1;
      padding: 1rem;
      gap: 1rem;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .sidebar {
      width: 360px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      height: 100%;
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      flex-shrink: 0;
    }

    .sidebar-content {
      padding: 1rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pin-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pin-card:hover {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .pin-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pin-card-body {
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .pin-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--alarm-red);
      color: #fca5a5;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #fff;
    }

    /* Popup Form Styling */
    .leaflet-popup-content-wrapper {
      background: rgba(30, 41, 59, 0.95) !important;
      color: #fff !important;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .leaflet-popup-tip {
      background: rgba(30, 41, 59, 0.95) !important;
    }

    .popup-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.2rem;
    }

    .popup-form input, .popup-form textarea {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .popup-form button {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 0.4rem;
      cursor: pointer;
      font-size: 0.85rem;
    }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .main-container { flex-direction: column; height: auto; }
      #map { height: 400px; }
      .sidebar { width: 100%; height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Inlog Pin Point Tracker</h1>
    </div>

    <div class="logo-container">
      <img src="https://images.squarespace-cdn.com/content/v1/51cdafc4e4b09eb676a64e68/1455062782638-O5OZ6Q2LKGVS7EVFENUH/image-asset.png" alt="Scouting Logo">
    </div>

    <div class="header-right">
      <a href="https://jeroend30.github.io/vmgdashboard/" class="btn-popup btn-logout">
        🚪 Uitloggen
      </a>
    </div>
  </header>

  <div class="main-container">
    <div id="map"></div>
    
    <div class="sidebar">
      <div class="sidebar-header">
        📍 Opgeslagen Vossen Pints (<span id="pin-count">0</span>)
      </div>
      <div class="sidebar-content" id="sidebar-pins-container">
        <em>Nog geen pins geplaatst. Klik op de kaart om een vos te pinpointen.</em>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Initialiseer de map (gecentreerd op Nederland)
    const map = L.map('map').setView([52.1326, 5.2913], 8);

    // OpenStreetMap tegel (Geen API-key benodigd)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let pins = JSON.parse(localStorage.getItem('joti_pin_points')) || [];
    let mapMarkers = [];

    function savePins() {
      localStorage.setItem('joti_pin_points', JSON.stringify(pins));
    }

    function renderPins() {
      // Verwijder oude markers van de map
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];

      const container = document.getElementById('sidebar-pins-container');
      document.getElementById('pin-count').innerText = pins.length;

      if (pins.length === 0) {
        container.innerHTML = '<em>Nog geen pins geplaatst. Klik op de kaart om een vos te pinpointen.</em>';
        return;
      }

      container.innerHTML = '';

      pins.forEach((pin, index) => {
        // Maak marker op de kaart
        const marker = L.marker([pin.lat, pin.lng]).addTo(map);
        marker.bindPopup(`<b>${pin.title}</b><br>${pin.note || 'Geen opmerking'}`);
        mapMarkers.push(marker);

        // Voeg toe aan sidebar
        const card = document.createElement('div');
        card.className = 'pin-card';
        card.onclick = () => {
          map.setView([pin.lat, pin.lng], 14);
          marker.openPopup();
        };

        card.innerHTML = `
          <div class="pin-card-title">
            <span>🦊 ${pin.title}</span>
          </div>
          <div class="pin-card-body">${pin.note || '<em>Geen opmerking</em>'}</div>
          <div class="pin-card-footer">
            <button class="btn-delete" onclick="event.stopPropagation(); deletePin(${index})">Verwijderen</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Klik op de kaart om een nieuwe pin toe te voegen via een popup formulier
    map.on('click', function(e) {
      const { lat, lng } = e.latlng;

      const popupContent = `
        <div class="popup-form">
          <h4>Vos Pinpointen</h4>
          <input type="text" id="new-pin-title" placeholder="Titel (bijv. Vos Alpha)" required />
          <textarea id="new-pin-note" placeholder="Opmerking (bijv. Laatst gezien richting het oosten)" rows="2"></textarea>
          <button onclick="addNewPin(${lat}, ${lng})">Opslaan</button>
        </div>
      `;

      L.popup()
        .setLatLng([lat, lng])
        .setContent(popupContent)
        .openOn(map);
    });

    window.addNewPin = function(lat, lng) {
      const titleInput = document.getElementById('new-pin-title');
      const noteInput = document.getElementById('new-pin-note');

      const title = titleInput ? titleInput.value.trim() : '';
      const note = noteInput ? noteInput.value.trim() : '';

      if (!title) {
        alert('Geef a.u.b. een titel op.');
        return;
      }

      pins.push({ lat, lng, title, note });
      savePins();
      renderPins();
      map.closePopup();
    };

    window.deletePin = function(index) {
      if (confirm('Weet je zeker dat je deze pin wilt verwijderen?')) {
        pins.splice(index, 1);
        savePins();
        renderPins();
      }
    };

    // Laad bestaande pins bij opstarten
    renderPins();

    // Zorg ervoor dat de kaart de juiste grootte berekent
    setTimeout(() => {
      map.invalidateSize();
    }, 100);
  </script>
</body>
</html>
