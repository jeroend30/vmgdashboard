<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inlog Pin Point - VMG</title>

  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --alarm-red: #ef4444;
      --alarm-red-glow: rgba(239, 68, 68, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url('https://images5.alphacoders.com/118/thumb-1920-1188770.jpg') center/cover no-repeat fixed;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
    }

    .logo-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      max-height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .refresh-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-popup {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid var(--accent);
      color: #7dd3fc;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-popup:hover {
      background: rgba(56, 189, 248, 0.38);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid var(--alarm-red);
      color: #fca5a5;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.38);
      color: #fff;
      box-shadow: 0 0 12px var(--alarm-red-glow);
    }

    .main-container {
      display: flex;
      flex: 1;
      padding: 1rem;
      gap: 1rem;
      height: calc(100vh - 65px);
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      background: rgba(30, 41, 59, 0.7);
    }

    .map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .main-container { flex-direction: column; height: auto; }
      .map-wrapper { height: 400px; }
      .header-right { gap: 0.4rem; }
      .refresh-status { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Inlog Pin Point Tracker</h1>
    </div>

    <div class="logo-container">
      <img src="https://images.squarespace-cdn.com/content/v1/51cdafc4e4b09eb676a64e68/1455062782638-O5OZ6Q2LKGVS7EVFENUH/image-asset.png" alt="Scouting Logo">
    </div>

    <div class="header-right">
      <span class="refresh-status">🔄 Ververst elke 30s</span>
      <a href="https://jeroend30.github.io/vmgdashboard/" class="btn-popup btn-logout">
        🚪 Uitloggen
      </a>
    </div>
  </header>

  <div class="main-container">
    <div class="map-wrapper">
      <iframe src="https://www.google.com/maps/d/embed?mid=1EaxMNS3cAKvZRuIKI6lF95YR0PUqmT4&ehbc=2E312F&noprof=1" width="640" height="480"></iframe>
    </div>
  </div>

  <script>
    // Automatisch verversen van de pagina elke 30 seconden (30000 milliseconden)
    setTimeout(function() {
      location.reload();
    }, 30000);
  </script>
</body>
</html>
